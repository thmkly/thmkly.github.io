<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tom Kelly</title>
  <meta name="description" content="field recordist, composer, photographer, and long-distance hiker based in los angeles" />
  <meta property="og:title" content="tom kelly" />
  <meta property="og:description" content="field recordist, composer, photographer, and long-distance hiker based in los angeles" />
  <meta property="og:image" content="https://thomasmkelly.com/images/OG-2D-overview.png" />
  <meta property="og:url" content="https://thomasmkelly.com" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/x-icon" href="favicon-sierra.ico?v=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: white;
      min-height: 100vh;
      background: url('/images/texture-bg.png') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-align: center;
      width: 100%;
      padding-top: 5vh;
      color: rgba(255,255,255,0.9);
      flex-shrink: 0;
    }
    .layout {
      display: flex;
      width: 100%;
      padding: 0 5%;
      flex: 1;
      align-items: center;
      justify-content: space-between;
    }
    .text-col {
      flex: 1;
      padding-right: 5%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .text-col a {
      color: white;
      text-decoration: underline;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .text-col a:hover { text-decoration: none; }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .socials {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.9;
    }
    .socials a { color: rgba(255,255,255,0.5); text-decoration: none; }
    .socials a:hover { color: white; }
    .more { font-size: 0.72rem; color: rgba(255,255,255,0.9); }
    .photo-col {
      width: 38%;
      flex-shrink: 0;
    }
    .photo-col img {
      width: 100%;
      display: block;
    }

    @media (max-width: 700px) {
      body { align-items: center; }
      h1 { padding-top: 6vh; text-align: center; }
      .layout {
        flex-direction: column;
        align-items: center;
        padding: 0;
        gap: 2rem;
      }
      .photo-col {
        width: calc(100% - 48px);
        order: -1;
      }
      .text-col {
        width: calc(100% - 48px);
        padding-right: 0;
        max-width: 100%;
        padding-bottom: 4vh;
      }
    }
  </style>
</head>
<body>
  <h1>tom kelly</h1>
  <div class="layout">
    <div class="text-col">
      <a href="/pct-soundmap/">a sound map of the pacific crest trail, 2023 →</a>
      <hr class="divider" />
      <div class="socials">
        <a href="mailto:thmkly@proton.me">e-mail</a> &nbsp;|&nbsp;
        <a href="https://www.youtube.com/@thmkly">youtube</a> &nbsp;|&nbsp;
        <a href="https://instagram.com/___tomk">instagram</a> &nbsp;|&nbsp;
        <a href="https://bsky.app/profile/thmkly.bsky.social">bluesky</a> &nbsp;|&nbsp;
        <a href="https://earth.fm/artists/tom-kelly/">earth.fm</a> &nbsp;|&nbsp;
        <a href="https://substack.com/@thmkly">substack</a>
      </div>
      <p class="more">more to come soon</p>
    </div>
    <div class="photo-col">
      <img src="/images/1X5A5038.JPG" alt="photo: tommy corey" />
    </div>
  </div>
</body>
</html>
