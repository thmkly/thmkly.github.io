<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tom Kelly</title>
  <meta name="description" content="Field recordist, composer, photographer, and long-distance hiker based in Los Angeles." />

  <!-- Open Graph -->
  <meta property="og:title" content="Tom Kelly" />
  <meta property="og:description" content="Field recordist, composer, photographer, and long-distance hiker based in Los Angeles." />
  <meta property="og:image" content="https://thomasmkelly.com/images/OG-2D-overview.png" />
  <meta property="og:url" content="https://thomasmkelly.com" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/x-icon" href="favicon-sierra.ico?v=1" />
  <link rel="icon" href="favicon-sierra.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --profile-size: 200px;
    }
    body {
      margin: 0;
      padding: 0;
      background-image: url('/images/index-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      padding-top: 20vh;
      box-sizing: border-box;
    }
    .profile-image {
      width: var(--profile-size);
      height: var(--profile-size);
      border-radius: 50%;
      object-fit: cover;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: 5px;
      max-width: 750px;
      margin-top: 5vh;
      font-weight: 300;
      text-align: center;
      width: 90%;
    }
    a {
      color: #ffffff;
      text-decoration: underline;
    }
    a:hover {
      text-decoration: none;
    }
    .map-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.25);
      margin: 1rem 0;
    }
    @media (max-width: 600px) {
      :root {
        --profile-size: 130px;
      }
      body {
        padding-top: 15vh;
      }
      .container {
        margin-top: 4vh;
        font-size: 0.95rem;
        padding: 1rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <img src="/images/tom_index-profile.png" alt="Tom Kelly" class="profile-image" />
  <div class="container">
    <p class="map-link">
      <a href="/pct-soundmap/">a sound map of the pacific crest trail, 2023 →</a>
    </p>
    <hr class="divider" />
    <p>
      Hi! I'm Tom — a field recordist, composer, photographer, and long-distance hiker based in Los Angeles, California.<br><br>
      More to come soon.<br><br>
      <a href="mailto:thmkly@proton.me">E-mail</a>  |  
      <a href="https://www.youtube.com/@thmkly">Youtube</a>  |  
      <a href="https://instagram.com/___tomk">Instagram</a>  |  
      <a href="https://bsky.app/profile/thmkly.bsky.social">BlueSky</a>  |  
      <a href="https://earth.fm/artists/tom-kelly/">Earth.fm</a>  |
      <a href="https://substack.com/@thmkly">Substack</a>
    </p>
  </div>
</body>
</html>
